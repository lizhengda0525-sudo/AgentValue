name: Windows build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Test data and file operations
        run: pnpm test
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          pnpm package *> artifacts/package.log
          $exitCode = $LASTEXITCODE
          Get-Content artifacts/package.log -Tail 80
          if ($exitCode -ne 0) {
            '### Installer build output' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```text' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            Get-Content artifacts/package.log -Tail 80 | Out-File $env:GITHUB_STEP_SUMMARY -Append
            '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
            exit $exitCode
          }
      - name: Test the packaged desktop app
        shell: pwsh
        run: |
          $env:AGENTVALUE_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/AgentValue.exe'
          pnpm test:ui
      - name: Test install and uninstall data preservation
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/installer-smoke.ps1 -Installer "release/AgentValue-Setup-$version-windows-x64.exe"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-test-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentValue-windows-x64
          path: |
            release/AgentValue-Setup-*-windows-x64.exe
            release/latest.yml
            release/*.blockmap
          retention-days: 14
