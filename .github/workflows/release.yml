name: Publish AgentValue Windows installer

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and branch
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a main commit' }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format:check
      - name: Test data and migration
        run: pnpm test
      - name: Build Windows installer and update metadata
        run: pnpm package
      - name: Test packaged desktop app
        shell: pwsh
        run: |
          $env:AGENTVALUE_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'release/win-unpacked/AgentValue.exe'
          pnpm test:ui
      - name: Test install and uninstall data preservation
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/installer-smoke.ps1 -Installer "release/AgentValue-Setup-$version-windows-x64.exe"
      - name: Publish tested installer
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release/AgentValue-Setup-$version-windows-x64.exe"
          if (-not (Test-Path $installer)) { throw 'Installer missing' }
          if (-not (Test-Path 'release/latest.yml')) { throw 'Update metadata missing' }
          $assets = @($installer, 'release/latest.yml')
          $blockmap = "$installer.blockmap"
          if (Test-Path $blockmap) { $assets += $blockmap }
          $assets | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $_ -Leaf)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          $assets += 'release/SHA256SUMS.txt'
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; never overwrite a published version' }
          gh release create $env:GITHUB_REF_NAME $assets --verify-tag --latest --title "AgentValue $env:GITHUB_REF_NAME" --notes 'Download AgentValue-Setup to install the Windows x64 desktop app. Personal data stays in a data folder inside the chosen installation directory and is kept when uninstalling. Versions 0.3.2 and 0.3.3 installed in a custom folder need one manual installer upgrade; future versions can be installed from within the app.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
